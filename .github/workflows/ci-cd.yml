name: Nginx CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-deploy-test:
    name: Validar, Subir Stack e Smoke Test
    runs-on: self-hosted

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Lint nos scripts Bash com ShellCheck
        run: shellcheck scripts/*.sh

      - name: Validar sintaxe do Docker Compose
        run: docker compose config -q

      - name: Subir ou atualizar containers na VM (Deploy)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker compose up -d --remove-orphans

      - name: Executar Smoke Test na stack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh
